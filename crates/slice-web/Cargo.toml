[package]
name = "slice-web"
description = "Browser UI for Slice (Leptos, client-side rendered, compiled to WebAssembly)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slice-core = { path = "../slice-core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "Request",
  "RequestInit",
  "Response",
  "Location",
  "BlobPropertyBag",
  "DataTransfer",
  "DragEvent",
  "Document",
  "Element",
  "File",
  "FileList",
  "FileReader",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "EventTarget",
  "History",
  "HtmlSelectElement",
  "Url",
  "Window",
]
