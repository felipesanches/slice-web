title: Slice
description: Build custom design sub-spaces from variable fonts, in the browser
theme: jekyll-theme-cayman

# The manual is generated. `manual.md` is its source and `slice-manual.tex` an
# intermediate; publishing either alongside the rendered `index.md` would put three
# copies of the same text on the site. The PDF in that directory is kept, because
# index.md links to it.
exclude:
  - manual/manual.md
  - manual/build.py
  - manual/slice-manual.tex

# `app/` is the compiled WebAssembly build, copied in after Jekyll has run. Naming it
# here stops Jekyll from deleting it if it ever runs over a directory that has one.
keep_files:
  - app
