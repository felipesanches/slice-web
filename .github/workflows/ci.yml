name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The solver's test vectors are lifted from fontTools. If the committed copy
      # has drifted from the pinned release, say so here rather than letting a stale
      # file quietly reduce what is being tested.
      - name: Solver vectors are up to date
        run: tools/gen-solver-vectors.py --check

  web:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: ./build.sh
      # Ubuntu runners ship chromium, which is what the smoke test looks for.
      - run: tools/browser-smoke.sh --no-build
      - run: tools/browser-slice-test.py --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: slice-web
          path: dist/

  parity:
    name: Parity with fontTools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runs the real fontTools on the same inputs and diffs the results, which is the
      # only check here that can catch a step being skipped altogether.
      - run: tools/compare-with-fonttools.py

  conformance:
    name: Conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyQt5 needs these to import, even though nothing here opens a window: the
      # corpus drives the original as a library and never constructs a QApplication.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: cargo build -p slice-cli

      # The fixtures are generated, and `build.py` asserts the properties each one
      # exists to have -- that `overlapping`'s bars really overlap, that `composites`
      # nests two deep. Rebuilding here catches a fixture edited by hand into
      # something that no longer tests what its cases assume.
      - name: Fixtures rebuild identically
        run: |
          python3 -m venv .suite-venv
          .suite-venv/bin/pip install -q "fonttools[woff]==4.62.1" brotli
          sha256sum tests/suite/fixtures/out/* > /tmp/fixtures.before
          .suite-venv/bin/python tests/suite/fixtures/build.py
          sha256sum -c /tmp/fixtures.before

      # Runs every case against both programs. Exits non-zero only when *this*
      # implementation fails one: the original's failures are adjudicated in
      # docs/adjudication.md and are expected.
      - run: tests/suite/run.py --verbose

      # The plain-English documentation is generated from the cases, so a case added
      # without regenerating it would ship an incomplete description of the suite.
      - name: Test-suite documentation is up to date
        run: tests/suite/gen-docs.py --check

  manual:
    name: Manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended

      # The PDF, the .tex and the GitHub Pages copy are all generated from
      # docs/manual/manual.md. Editing the source without rebuilding would publish a
      # manual that disagrees with itself, which is worse than one merely out of date.
      - name: The manual is up to date
        run: docs/manual/build.py --check

      # And that it still typesets: --check only compares the committed files.
      - name: The manual still builds
        run: docs/manual/build.py && git diff --exit-code docs/
