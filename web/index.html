<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slice — custom design sub-spaces from variable fonts</title>
    <meta
      name="description"
      content="Build custom design sub-spaces from variable fonts, in the browser. Pin axes, edit name records and bit flags, and merge overlapping contours. Fonts never leave your machine."
    />
    <link rel="stylesheet" href="./slice.css" />
    <link rel="icon" href="./slice-icon.svg" />
  </head>
  <body>
    <noscript>
      <div class="noscript">
        <h1>Slice</h1>
        <p>
          Slice runs entirely in your browser, which means it needs JavaScript and
          WebAssembly enabled. Nothing is uploaded — that is the reason it works this
          way.
        </p>
      </div>
    </noscript>

    <div id="boot" class="boot">
      <p>Loading the engine…</p>
    </div>

    <script type="module">
      import init from "./pkg/slice_web.js";

      const boot = document.getElementById("boot");
      try {
        await init();
        boot.remove();
      } catch (error) {
        // A failure here is almost always a browser without WebAssembly, or the
        // .wasm file not being served with the right MIME type. Say so, rather
        // than leaving a blank page.
        console.error(error);
        boot.innerHTML =
          "<h1>Slice</h1><p>The engine could not start. Slice needs a browser with " +
          "WebAssembly support.</p><pre></pre>";
        boot.querySelector("pre").textContent = String(error);
        boot.classList.add("failed");
      }
    </script>
  </body>
</html>
